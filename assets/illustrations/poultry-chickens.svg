<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <!-- Subtle dark container -->
  <rect width="600" height="400" rx="12" fill="#14231A"/>
  <rect width="600" height="400" rx="12" stroke="#2D6A4F" stroke-width="2"/>

  <!-- Farm background hills & organic range -->
  <path d="M 40 340 Q 200 280 380 310 T 560 280 L 560 370 L 40 370 Z" fill="#1C3024" opacity="0.8"/>
  <path d="M 40 310 Q 180 250 350 270 T 560 240 L 560 370 L 40 370 Z" fill="#17281F" opacity="0.6"/>

  <!-- Hen / Rooster Poultry Silhouette -->
  <g transform="translate(310, 225)">
    <!-- Chicken Body -->
    <path d="M -60 30 C -90 10 -90 -40 -50 -55 C -30 -65 0 -60 20 -40 C 50 -45 75 -25 70 10 C 65 40 20 60 -30 55 C -50 50 -55 40 -60 30 Z" fill="#243F30" stroke="#5ECA95" stroke-width="2.2"/>
    <!-- Tail Feathers -->
    <path d="M -65 -10 C -115 -35 -110 -80 -80 -70 C -70 -65 -65 -45 -60 -35" stroke="#48B07D" stroke-width="3" stroke-linecap="round"/>
    <path d="M -60 -25 C -100 -60 -85 -95 -60 -80 C -55 -70 -55 -50 -50 -40" stroke="#5ECA95" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Neck & Head -->
    <path d="M 15 -35 C 20 -70 45 -85 65 -85 C 80 -85 90 -75 85 -60 C 80 -45 65 -30 50 -20" fill="#2D4D3B" stroke="#5ECA95" stroke-width="2"/>
    <circle cx="72" cy="-70" r="3" fill="#EDF4EF"/>
    <!-- Comb (Crest) in warm amber -->
    <path d="M 60 -85 C 60 -100 70 -105 75 -90 C 80 -105 90 -95 85 -85 Z" fill="#F4A236" stroke="#9A5B00" stroke-width="1.5"/>
    <!-- Beak in amber -->
    <path d="M 85 -65 L 105 -60 L 85 -55 Z" fill="#F4A236"/>
    <!-- Wattle -->
    <path d="M 78 -55 C 82 -42 70 -42 72 -55 Z" fill="#9A5B00"/>
    <!-- Wing feather contour -->
    <path d="M -20 -15 C -10 15 20 20 35 -5" stroke="#74D4A7" stroke-width="2" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M -15 52 L -15 90 L -5 95" stroke="#F4A236" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 10 54 L 15 90 L 25 95" stroke="#F4A236" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Feed Grains & Dried Larvae in Foreground -->
  <g transform="translate(420, 310)">
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="#9A5B00" stroke="#F4A236" stroke-width="1"/>
    <ellipse cx="20" cy="-5" rx="10" ry="3.5" fill="#5ECA95" stroke="#74D4A7" stroke-width="1"/>
    <ellipse cx="-15" cy="5" rx="11" ry="4" fill="#9A5B00" stroke="#F4A236" stroke-width="1"/>
  </g>

  <!-- Badge / Label -->
  <rect x="30" y="30" width="180" height="32" rx="6" fill="#0D1611" stroke="#2D6A4F" stroke-width="1"/>
  <text x="45" y="51" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#5ECA95">ПТАХІВНИЦТВО · КОРМ</text>
</svg>
