<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <!-- Subtle dark container -->
  <rect width="600" height="400" rx="12" fill="#14231A"/>
  <rect width="600" height="400" rx="12" stroke="#2D6A4F" stroke-width="2"/>

  <!-- Warm organic background contour -->
  <path d="M 40 330 Q 180 270 340 300 T 560 270 L 560 370 L 40 370 Z" fill="#1B3125" opacity="0.8"/>
  <circle cx="440" cy="180" r="140" fill="#243E2E" opacity="0.4"/>

  <!-- Dog Silhouette Profile (Friendly domestic companion) -->
  <g transform="translate(230, 220)">
    <!-- Dog body & chest -->
    <path d="M -80 70 C -70 10 -40 -30 20 -40 C 50 -45 80 -30 90 0 C 95 30 90 70 85 80 L -80 80 Z" fill="#203A2B" stroke="#5ECA95" stroke-width="2.2"/>
    <!-- Dog Head & Muzzle -->
    <path d="M 20 -40 C 15 -70 35 -100 65 -90 C 85 -85 95 -70 105 -50 C 130 -45 145 -35 140 -20 C 135 -10 115 -10 105 -20 C 95 0 90 10 90 20" fill="#264835" stroke="#5ECA95" stroke-width="2.2"/>
    <!-- Floppy / Alert Ear -->
    <path d="M 45 -90 C 35 -115 10 -110 5 -85 C 0 -65 15 -50 25 -65 Z" fill="#1B3325" stroke="#74D4A7" stroke-width="2"/>
    <!-- Eye & Nose -->
    <circle cx="85" cy="-60" r="3.5" fill="#EDF4EF"/>
    <ellipse cx="140" cy="-28" rx="5" ry="4" fill="#0D1611"/>
    <!-- Collar in amber -->
    <path d="M 35 -15 C 55 -5 75 0 95 -5" stroke="#F4A236" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Cat Silhouette Profile (Elegant feline companion) -->
  <g transform="translate(420, 235)">
    <!-- Cat body sitting -->
    <path d="M -30 65 C -40 20 -30 -30 0 -50 C 20 -30 35 10 30 65 Z" fill="#234230" stroke="#74D4A7" stroke-width="2"/>
    <!-- Cat head -->
    <circle cx="-5" cy="-75" r="24" fill="#2D523C" stroke="#74D4A7" stroke-width="2"/>
    <!-- Pointed ears -->
    <polygon points="-24,-88 -20,-112 -5,-96" fill="#1E3829" stroke="#74D4A7" stroke-width="1.8"/>
    <polygon points="-2,-96 12,-112 16,-88" fill="#1E3829" stroke="#74D4A7" stroke-width="1.8"/>
    <!-- Curled Tail -->
    <path d="M 30 60 C 60 55 75 25 65 0 C 60 -15 50 -10 52 0 C 55 15 45 40 25 45" stroke="#74D4A7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pet Bowl with Hypoallergenic Insect Kibble in Foreground -->
  <g transform="translate(140, 310)">
    <!-- Bowl -->
    <ellipse cx="0" cy="15" rx="45" ry="12" fill="#0D1611" stroke="#2D6A4F" stroke-width="2"/>
    <path d="M -45 15 L -35 38 C -35 44 35 44 35 38 L 45 15 Z" fill="#182E21" stroke="#2D6A4F" stroke-width="2"/>
    <!-- Kibble pellets in amber & teal -->
    <circle cx="-15" cy="14" r="4.5" fill="#F4A236"/>
    <circle cx="0" cy="12" r="5" fill="#9A5B00"/>
    <circle cx="15" cy="14" r="4.5" fill="#5ECA95"/>
    <circle cx="-5" cy="17" r="4" fill="#F4A236"/>
    <circle cx="10" cy="17" r="4" fill="#9A5B00"/>
  </g>

  <!-- Badge / Label -->
  <rect x="30" y="30" width="195" height="32" rx="6" fill="#0D1611" stroke="#2D6A4F" stroke-width="1"/>
  <text x="45" y="51" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#5ECA95">PET FOOD · КОРМИ ДЛЯ ТВАРИН</text>
</svg>
