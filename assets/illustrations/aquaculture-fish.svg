<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <!-- Subtle dark container -->
  <rect width="600" height="400" rx="12" fill="#14231A"/>
  <rect width="600" height="400" rx="12" stroke="#2D6A4F" stroke-width="2"/>

  <!-- Water wave currents -->
  <path d="M 40 180 Q 180 140 320 180 T 560 160" stroke="#2D6A4F" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M 40 280 Q 200 240 360 280 T 560 260" stroke="#2D6A4F" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
  <path d="M 40 330 Q 160 300 300 330 T 560 320" stroke="#1C3829" stroke-width="3" opacity="0.7"/>

  <!-- Rainbow Trout / Aquaculture Fish Silhouette -->
  <g transform="translate(300, 205)">
    <!-- Streamlined Fish Body -->
    <path d="M -160 0 C -120 -40 -30 -50 70 -25 C 130 -10 170 0 170 0 C 170 0 130 10 70 25 C -30 50 -120 40 -160 0 Z" fill="#203E2D" stroke="#5ECA95" stroke-width="2.2"/>
    <!-- Tail Fin -->
    <path d="M -160 0 L -210 -45 C -190 -10 -190 10 -210 45 Z" fill="#183324" stroke="#5ECA95" stroke-width="2"/>
    <!-- Dorsal Fin -->
    <path d="M -30 -45 L 30 -65 L 50 -32 Z" fill="#2B523D" stroke="#74D4A7" stroke-width="1.8"/>
    <!-- Pectoral Fin -->
    <path d="M 40 10 L 70 45 L 30 30 Z" fill="#2B523D" stroke="#74D4A7" stroke-width="1.8"/>
    <!-- Anal / Pelvic Fin -->
    <path d="M -50 38 L -30 60 L -10 32 Z" fill="#2B523D" stroke="#74D4A7" stroke-width="1.8"/>
    <!-- Lateral Line with Bio-luminescent glow -->
    <path d="M -150 0 C -50 -5 50 0 140 0" stroke="#74D4A7" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.8"/>
    <!-- Eye & Gill cover -->
    <circle cx="120" cy="-6" r="5" fill="#EDF4EF"/>
    <circle cx="120" cy="-6" r="2.5" fill="#0D1611"/>
    <path d="M 85 -20 C 100 0 100 10 85 20" stroke="#5ECA95" stroke-width="1.8"/>
  </g>

  <!-- Feed Pellets sinking down -->
  <g transform="translate(430, 110)">
    <circle cx="0" cy="0" r="4.5" fill="#F4A236"/>
    <circle cx="20" cy="35" r="4" fill="#9A5B00"/>
    <circle cx="-15" cy="70" r="5" fill="#F4A236"/>
  </g>

  <!-- Water bubbles -->
  <circle cx="160" cy="140" r="6" stroke="#5ECA95" stroke-width="1.5" opacity="0.6"/>
  <circle cx="180" cy="115" r="3.5" stroke="#5ECA95" stroke-width="1.5" opacity="0.6"/>
  <circle cx="480" cy="270" r="5" stroke="#5ECA95" stroke-width="1.5" opacity="0.5"/>

  <!-- Badge / Label -->
  <rect x="30" y="30" width="180" height="32" rx="6" fill="#0D1611" stroke="#2D6A4F" stroke-width="1"/>
  <text x="45" y="51" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#5ECA95">АКВАКУЛЬТУРА · РИБА</text>
</svg>
