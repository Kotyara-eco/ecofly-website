<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <!-- Subtle dark organic container -->
  <rect width="600" height="400" rx="12" fill="#14231A"/>
  <rect width="600" height="400" rx="12" stroke="#2D6A4F" stroke-width="2"/>

  <!-- Organic substrate layers (spent grains, pomace) -->
  <path d="M 50 350 Q 180 270 320 310 T 550 290 L 550 370 L 50 370 Z" fill="#24382B" opacity="0.9"/>
  <path d="M 50 320 Q 220 250 380 270 T 550 250 L 550 370 L 50 370 Z" fill="#1C2E23" opacity="0.8"/>

  <!-- Spent Brewer's Grain & Vegetable Pomace Silhouette Group -->
  <g transform="translate(300, 210)">
    <!-- Heap base -->
    <ellipse cx="0" cy="50" rx="180" ry="45" fill="#3D5A45" opacity="0.6"/>
    <!-- Malt & barley grains stylized -->
    <path d="M -80 30 C -95 10 -65 -10 -50 10 C -40 25 -65 40 -80 30 Z" fill="#9A5B00" stroke="#F4A236" stroke-width="1.5"/>
    <path d="M -40 10 C -55 -10 -25 -30 -10 -10 C 0 5 -25 20 -40 10 Z" fill="#9A5B00" stroke="#F4A236" stroke-width="1.5"/>
    <path d="M 20 20 C 5 0 35 -20 50 0 C 60 15 35 30 20 20 Z" fill="#9A5B00" stroke="#F4A236" stroke-width="1.5"/>
    <path d="M 70 35 C 55 15 85 -5 100 15 C 110 30 85 45 70 35 Z" fill="#9A5B00" stroke="#F4A236" stroke-width="1.5"/>

    <!-- Apple / Fruit Pomace slices (cider / juice production) -->
    <path d="M -20 -30 C 15 -60 60 -30 40 10 C 20 30 -5 -10 -20 -30 Z" fill="#2D6A4F" stroke="#5ECA95" stroke-width="2"/>
    <circle cx="10" cy="-10" r="3" fill="#14231A"/>

    <!-- Plant Leaves & Trimmings -->
    <path d="M -120 10 C -150 -20 -110 -50 -80 -30 C -60 -15 -90 20 -120 10 Z" fill="#1E4533" stroke="#5ECA95" stroke-width="1.8"/>
    <line x1="-120" y1="10" x2="-80" y2="-30" stroke="#5ECA95" stroke-width="1.2"/>
  </g>

  <!-- Circular Economy Waste Badge / Label -->
  <rect x="30" y="30" width="170" height="32" rx="6" fill="#0D1611" stroke="#2D6A4F" stroke-width="1"/>
  <text x="45" y="51" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#5ECA95">РОСЛИННІ ВІДХОДИ</text>
</svg>
