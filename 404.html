<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Сторінку не знайдено | EcoFly Kyiv</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #F7F9F6;
      --bg-surface: #FFFFFF;
      --text-primary: #142419;
      --text-secondary: #425749;
      --brand-pine: #1B4332;
      --brand-forest: #2D6A4F;
      --accent-amber: #9A5B00;
      --border-subtle: #DCE5DE;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0D1611;
        --bg-surface: #14231A;
        --text-primary: #EEF5F0;
        --text-secondary: #A6BCAD;
        --brand-pine: #48B07D;
        --brand-forest: #5ECA95;
        --accent-amber: #F4A236;
        --border-subtle: #24392C;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Golos Text', -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 3rem 2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .code {
      font-family: 'Manrope', sans-serif;
      font-size: 5rem;
      font-weight: 800;
      color: var(--brand-forest);
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--brand-pine);
      color: #FFFFFF;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: var(--brand-forest);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Сторінку не знайдено / Page Not Found</h1>
    <p>
      Схоже, адреса змінилася або сторінку було видалено. Але всі органічні залишки завжди повертаються у свій замкнений цикл!
    </p>
    <a href="index.html" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Повернутися на головну EcoFly
    </a>
  </div>
</body>
</html>
